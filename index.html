  return `
    <h2>בחרו את מסלול הבדיקה</h2>
    <p class="sub">שאלון מקצועי המבוסס על דרישות תקנות הבטיחות החדשות ועל בחינת האחריות של מזמין העבודה ומבצע הבנייה. התוכן מותאם לאחריות ולתהליכים הנדרשים בכל צד של הפרויקט.</p>
    ${Object.keys(TRACKS).map(key => `
      <div class="track-card" onclick="startTrack('${key}')">
        <div class="track-icon">${TRACKS[key].icon}</div>
        <div>
          <h3>${TRACKS[key].name}</h3>
          <p>${TRACKS[key].desc}</p>
        </div>
      </div>
    `).join("")}
  `;
}

function startTrack(key){
  state = { screen:"question", trackKey:key, qIndex:0, answers:[] };
  render();
}

function questionHTML(){
  const track = TRACKS[state.trackKey];
  const q = track.questions[state.qIndex];
  return `
    <div class="progress-row">
      <span>שאלה ${state.qIndex+1} מתוך ${track.questions.length}</span>
      <span>${track.name}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${((state.qIndex+1)/track.questions.length)*100}%"></div></div>
    <div class="q-title">${q}</div>
    ${OPTIONS.map((opt,i) => `<div class="option" onclick="answer(${i})">${opt.label}</div>`).join("")}
    ${state.qIndex>0 ? `<button class="back-link" onclick="back()">→ חזרה</button>` : ""}
  `;
}

function answer(i){
  state.answers.push(OPTIONS[i]);
  const track = TRACKS[state.trackKey];
  if(state.qIndex < track.questions.length-1){
    state.qIndex++;
  } else {
    state.screen = "result";
  }
  render();
}

function back(){
  state.qIndex--;
  state.answers.pop();
  render();
}

function computeScore(){
  const total = state.answers.reduce((s,a)=>s+a.score,0);
  const max = state.answers.length*2;
  return Math.round((total/max)*100);
}

function getAllGaps(){
  const track = TRACKS[state.trackKey];
  return state.answers
    .map((a,i)=>({ label: track.shortLabels[i], score: a.score, tag: a.score===0 ? "לטיפול" : "להשלמה" }))
    .filter(x=>x.score<2)
    .sort((a,b)=>a.score-b.score);
}

function getGaps(){
  return getAllGaps().slice(0,2);
}

function getStats(){
  const ok = state.answers.filter(a=>a.score===2).length;
  const partial = state.answers.filter(a=>a.score===1).length;
  const material = state.answers.filter(a=>a.score===0).length;
  return { ok, partial, material };
}

function getCategoryBreakdown(){
  const track = TRACKS[state.trackKey];
  return track.categories.map(cat=>{
    const scores = cat.q.map(i=>state.answers[i].score);
    const percent = Math.round((scores.reduce((s,v)=>s+v,0) / (scores.length*2)) * 100);
    return { name: cat.name, percent };
  });
}

function noGapsRow(tagText){
  return `
    <div class="gap-item">
      <div class="num ok-check">✓</div>
      <p>לא זוהו פערים מהותיים. מומלץ לבצע אימות מקצועי פרטני.</p>
      <span class="tag-verify">${tagText}</span>
    </div>
  `;
}

function resultHTML(){
  const track = TRACKS[state.trackKey];
  const score = computeScore();
  const gaps = getGaps();
  let level, msg, color;
  if(score>=80){ level="מוכנות גבוהה"; color="var(--green)"; msg="קיימת אצלכם תשתית טובה. מומלץ להשלים אימות פרטני ולוודא שהיישום עקבי בכל הפרויקטים."; }
  else if(score>=50){ level="מוכנות חלקית"; color="var(--amber)"; msg="קיימת תשתית ראשונית, אך זוהו פערים שכדאי להסדיר לפני כניסת התקנות לתוקף."; }
  else { level="חשיפה משמעותית"; color="var(--red)"; msg="נדרשת תוכנית היערכות ממוקדת להסדרת אחריות, תהליכי בקרה ותיעוד."; }

  const circumference = 2*Math.PI*48;
  const offset = circumference - (score/100)*circumference;

  return `
    <div class="result-top">
      <span class="pill">דוח מוכנות ראשוני</span>
    </div>
    <div class="track-name">${track.name}</div>
    <div class="score-wrap">
      <div class="ring">
        <svg width="110" height="110">
          <circle cx="55" cy="55" r="48" stroke="#eef1f5" stroke-width="10" fill="none"/>
          <circle cx="55" cy="55" r="48" stroke="${color}" stroke-width="10" fill="none"
            stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="center"><b>${score}</b><span>ציון מוכנות</span></div>
      </div>
      <div class="score-text">
        <h3 style="color:${color}">${level}</h3>
        <p>${msg}</p>
      </div>
    </div>
    <div class="legend">
      <span><i class="g"></i>מוכנות גבוהה</span>
      <span><i class="a"></i>מוכנות חלקית</span>
      <span><i class="r"></i>חשיפה משמעותית</span>
    </div>
    <div class="gaps-title"><span class="bar"></span>${gaps.length>1?"שני הפערים המרכזיים":gaps.length===1?"הפער המרכזי":"סיכום ראשוני"}</div>
    ${gaps.length ? gaps.map((g,i)=>`
      <div class="gap-item">
        <div class="num">${i+1}</div>
        <p>${g.label}</p>
        <span class="${g.tag==='לטיפול'?'tag-fix':'tag-partial'}">${g.tag}</span>
      </div>
    `).join("") : noGapsRow("לאימות")}
    <div class="lead-box">
      <h4>לקבלת הפירוט המלא של הממצאים לפי נושאים</h4>
      <p class="hint">מלאו את הפרטים והדוח המלא יוצג מיד.</p>
      <form id="leadForm" onsubmit="submitLead(event)">
        <div class="field-row">
          <div class="field"><label>שם</label><input required id="f_first" /></div>
          <div class="field"><label>שם משפחה</label><input required id="f_last" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>תפקיד</label><input required id="f_role" /></div>
          <div class="field"><label>חברה</label><input required id="f_company" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>מספר נייד</label><input required id="f_phone" type="tel" /></div>
        </div>
        <button class="submit-btn" id="submitBtn" type="submit">הצגת הדוח המלא</button>
        <div id="errMsg"></div>
      </form>
    </div>
    <p class="disclaimer">השאלון מעניק אינדיקציה ראשונית בלבד ואינו מהווה ייעוץ משפטי, הנדסי או בטיחותי.</p>
    <button class="restart" onclick="restart()">התחלת בדיקה חדשה</button>
  `;
}

function submitLead(e){
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const err = document.getElementById("errMsg");
  err.innerHTML = "";
  const payload = {
    type: "lead",
    timestamp: new Date().toLocaleString("he-IL"),
    track: TRACKS[state.trackKey].name,
    score: computeScore(),
    firstName: document.getElementById("f_first").value,
    lastName: document.getElementById("f_last").value,
    role: document.getElementById("f_role").value,
    company: document.getElementById("f_company").value,
    phone: document.getElementById("f_phone").value,
    gaps: getAllGaps().map(g=>`${g.label} (${g.tag})`).join(" | "),
    answers: state.answers.map((a,i)=>`${TRACKS[state.trackKey].questions[i]} => ${a.label}`).join(" || "),
    wantsCall: "לא"
  };

  if(GAS_URL.indexOf("PASTE_YOUR") === 0){
    err.innerHTML = '<div class="error-msg">טרם הוגדר חיבור ל-Google Sheets. ראו קובץ ההוראות המצורף.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = "שולח...";

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(()=>{
    state.lead = payload;
    state.screen = "full";
    render();
  }).catch(()=>{
    btn.disabled = false;
    btn.textContent = "הצגת הדוח המלא";
    err.innerHTML = '<div class="error-msg">שגיאה בשליחה. נסו שוב.</div>';
  });
}

function requestCall(){
  const btn = document.getElementById("callBtn");
  const err = document.getElementById("callErrMsg");
  err.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "שולח...";

  const payload = {
    type: "callRequest",
    timestamp: new Date().toLocaleString("he-IL"),
    firstName: state.lead.firstName,
    lastName: state.lead.lastName,
    phone: state.lead.phone,
    track: state.lead.track
  };

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(()=>{
    document.getElementById("ctaBox").innerHTML = `
      <div class="success-box" style="padding:8px 0;">
        <div class="ok" style="width:44px;height:44px;font-size:20px;">✓</div>
        <h3 style="font-size:15px;">הבקשה נשלחה בהצלחה</h3>
        <p>תודה, ${state.lead.firstName}! ניצור איתכם קשר בהקדם.</p>
      </div>
    `;
  }).catch(()=>{
    btn.disabled = false;
    btn.textContent = "אשמח לתאם שיחה ולקבל מידע נוסף";
    err.innerHTML = '<div class="error-msg">שגיאה בשליחה. נסו שוב.</div>';
  });
}

function fullReportHTML(){
  const track = TRACKS[state.trackKey];
  const score = computeScore();
  const stats = getStats();
  const cats = getCategoryBreakdown();
  const gaps = getAllGaps();

  function catColor(p){ return p>=80 ? "var(--green)" : p>=50 ? "var(--amber)" : "var(--red)"; }

  return `
    <div class="result-top">
      <span class="pill">דוח מוכנות מלא</span>
    </div>
    <div class="track-name">${track.name}</div>
    <p class="hint" style="margin-bottom:18px;">מלאו את הפרטים והדוח המלא יוצג מיד.</p>

    <div class="stat-row">
      <div class="stat-tile"><b>${stats.ok}</b><span>נושאים מוסדרים</span></div>
      <div class="stat-tile amber"><b>${stats.partial}</b><span>פערים חלקיים</span></div>
      <div class="stat-tile red"><b>${stats.material}</b><span>פערים מהותיים</span></div>
    </div>

    <div class="gaps-title"><span class="bar"></span>תמונת מצב לפי תחומים</div>
    ${cats.map(c=>`
      <div class="cat-row">
        <div class="cat-row-top"><span>${c.name}</span><b style="color:${catColor(c.percent)}">${c.percent}%</b></div>
        <div class="progress-track"><div class="progress-fill" style="width:${c.percent}%;background:${catColor(c.percent)}"></div></div>
      </div>
    `).join("")}

    <div class="gaps-title"><span class="bar"></span>כל הפערים שזוהו</div>
    ${gaps.length ? gaps.map((g,i)=>`
      <div class="gap-item">
        <div class="num">${i+1}</div>
        <p>${g.label}</p>
        <span class="${g.tag==='לטיפול'?'tag-fix':'tag-partial'}">${g.tag}</span>
      </div>
    `).join("") : noGapsRow("לאימות")}

    <div class="cta-box" id="ctaBox">
      <h4>רוצים לקבל פרטים ומידע נוסף?</h4>
      <p class="hint">נשמח לתאם שיחה קצרה, לעבור על ממצאי השאלון ולספק מידע נוסף שיסייע לכם להיערך לקראת כניסת תקנות הבטיחות החדשות לתוקף.</p>
      <button class="submit-btn" id="callBtn" onclick="requestCall()">אשמח לתאם שיחה ולקבל מידע נוסף</button>
      <div id="callErrMsg"></div>
    </div>

    <button class="restart" onclick="restart()">התחלת בדיקה חדשה</button>
  `;
}

function restart(){
  state = { screen:"intro", trackKey:null, qIndex:0, answers:[] };
  render();
}

render();
</script>
</body>
</html>
