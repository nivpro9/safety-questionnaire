<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Pro Safety</title>
<meta name="description" content="בדיקה קצרה שתמפה את רמת המוכנות שלכם לתקנות הבטיחות החדשות, תזהה פערים ותסמן את הנושאים שכדאי להסדיר כבר עכשיו.">
<meta property="og:type" content="website">
<meta property="og:title" content="Project Pro Safety">
<meta property="og:description" content="בדיקה קצרה שתמפה את רמת המוכנות שלכם לתקנות הבטיחות החדשות, תזהה פערים ותסמן את הנושאים שכדאי להסדיר כבר עכשיו.">
<meta property="og:image" content="https://nivpro9.github.io/safety-questionnaire/logo.png">
<meta property="og:url" content="https://nivpro9.github.io/safety-questionnaire/">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Project Pro Safety">
<meta name="twitter:description" content="בדיקה קצרה שתמפה את רמת המוכנות שלכם לתקנות הבטיחות החדשות.">
<meta name="twitter:image" content="https://nivpro9.github.io/safety-questionnaire/logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#22c55e;
    --green-dark:#16a34a;
    --teal:#2dd4bf;
    --navy:#0f2a4a;
    --navy-dark:#0a1d33;
    --navy-light:#173a63;
    --amber:#f59e0b;
    --red:#ef4444;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --bg-left:#f4f6f9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Heebo',sans-serif;
    color:var(--text);
    background:var(--bg-left);
    min-height:100vh;
  }
  .wrap{
    display:flex;
    min-height:100vh;
  }
  /* RIGHT (brand) panel is visually on the right in RTL, i.e. second in flex order */
  .right{
    flex:1 1 50%;
    background:radial-gradient(circle at 70% 20%, var(--navy-light), var(--navy) 55%, var(--navy-dark) 100%);
    color:#fff;
    padding:48px 56px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:100vh;
  }
  .right::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
  }
  .logo{
    display:flex;
    margin-bottom:40px;
    position:relative;
    z-index:1;
    width:fit-content;
  }
  .logo img{height:64px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
  .badge{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    padding:6px 14px;border-radius:999px;
    font-size:13px;font-weight:600;color:#bcd4ef;
    margin-bottom:24px;
    width:fit-content;
    position:relative;z-index:1;
  }
  .badge::before{content:"—";color:var(--teal);}
  .right h1{
    font-size:38px;line-height:1.3;font-weight:800;margin-bottom:20px;
    position:relative;z-index:1;
  }
  .right p.lead{
    font-size:16px;color:#c7d7ea;line-height:1.8;max-width:520px;margin-bottom:32px;
    position:relative;z-index:1;
  }
  .date-box{
    display:inline-flex;align-items:center;gap:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    padding:14px 20px;border-radius:14px;
    width:fit-content;margin-bottom:48px;
    position:relative;z-index:1;
  }
  .date-box .num{font-size:26px;font-weight:800;color:var(--green);}
  .date-box .label{font-size:13px;color:#bcd4ef;line-height:1.5;}
  .features{
    display:flex;gap:28px;flex-wrap:wrap;
    position:relative;z-index:1;
  }
  .features span{
    font-size:13px;color:#bcd4ef;display:flex;align-items:center;gap:6px;
  }
  .features span::before{content:"✓";color:var(--green);font-weight:800;}

  /* LEFT (form) panel */
  .left{
    flex:1 1 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(15,42,74,.06);
    padding:36px;
    width:100%;
    max-width:420px;
  }
  .card h2{font-size:22px;font-weight:800;margin-bottom:14px;}
  .card .sub{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:26px;}

  .track-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    cursor:pointer;
    transition:.15s;
    display:flex;gap:14px;align-items:flex-start;
  }
  .track-card:hover{border-color:var(--green);box-shadow:0 4px 14px rgba(34,197,94,.12);}
  .track-icon{
    width:36px;height:36px;border-radius:10px;
    background:#eef5ff;color:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;
  }
  .track-card h3{font-size:15px;font-weight:700;margin-bottom:4px;}
  .track-card p{font-size:12.5px;color:var(--muted);line-height:1.6;}

  .progress-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .progress-track{height:6px;border-radius:4px;background:#eef1f5;overflow:hidden;margin-bottom:26px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber));border-radius:4px;transition:width .3s;}

  .q-title{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:20px;}
  .option{
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:14px;font-weight:600;
    transition:.15s;
    background:#fff;
  }
  .option:hover{border-color:var(--green);background:#f6fbf7;}
  .option::before{content:"‹";color:#cbd5e1;font-weight:800;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:8px;color:var(--muted);font-size:13px;font-weight:600;
    cursor:pointer;background:none;border:none;
  }
  .back-link:hover{color:var(--navy);}

  /* result screen */
  .result-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .pill{
    font-size:11px;font-weight:700;background:#eef5ff;color:var(--navy);
    padding:4px 10px;border-radius:999px;
  }
  .track-name{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:18px;}
  .score-wrap{display:flex;align-items:center;gap:20px;margin-bottom:18px;}
  .score-text h3{font-size:20px;font-weight:800;margin-bottom:6px;}
  .score-text p{font-size:13px;color:var(--muted);line-height:1.7;}
  .ring{position:relative;width:110px;height:110px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .ring .center b{font-size:26px;}
  .ring .center span{font-size:10.5px;color:var(--muted);}
  .legend{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .legend span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .legend .g{background:var(--green);}
  .legend .a{background:var(--amber);}
  .legend .r{background:var(--red);}

  .gaps-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:12px;color:var(--text);}
  .gaps-title .bar{width:4px;height:16px;background:var(--amber);border-radius:2px;}
  .gap-item{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;
  }
  .gap-item .num{
    width:22px;height:22px;border-radius:50%;background:#fff3e0;color:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;
  }
  .gap-item p{font-size:13px;font-weight:600;flex:1;}
  .tag-fix{font-size:11px;color:var(--red);background:#fef2f2;padding:3px 8px;border-radius:999px;font-weight:700;flex-shrink:0;}

  .lead-box{border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:22px;}
  .lead-box h4{font-size:14.5px;font-weight:700;margin-bottom:6px;}
  .lead-box .hint{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .field-row{display:flex;gap:10px;margin-bottom:10px;}
  .field{flex:1;}
  .field label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .field input{
    width:100%;border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;font-family:inherit;font-size:13.5px;
  }
  .field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15);}
  .submit-btn{
    width:100%;background:var(--green-dark);color:#fff;border:none;
    padding:13px;border-radius:10px;font-weight:700;font-size:14.5px;
    cursor:pointer;margin-top:4px;transition:.15s;font-family:inherit;
  }
  .submit-btn:hover{background:#15803d;}
  .submit-btn:disabled{opacity:.6;cursor:not-allowed;}
  .disclaimer{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px;text-align:center;}
  .restart{
    display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--muted);
    cursor:pointer;background:none;border:none;font-weight:600;width:100%;
  }
  .restart:hover{color:var(--navy);}
  .success-box{text-align:center;padding:20px 0;}
  .success-box .ok{
    width:54px;height:54px;border-radius:50%;background:#ecfdf3;color:var(--green-dark);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;
  }
  .success-box h3{font-size:17px;font-weight:800;margin-bottom:8px;}
  .success-box p{font-size:13.5px;color:var(--muted);line-height:1.7;}
  .error-msg{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;}

  @media (max-width:900px){
    .wrap{flex-direction:column-reverse;}
    .right{padding:32px 24px;min-height:auto;}
    .right h1{font-size:28px;}
    .left{padding:24px 16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="card" id="card"></div>
  </div>

  <div class="right">
    <div class="logo"><img src="logo.png" alt="Project Pro Group"></div>
    <div class="badge">תקנות הבטיחות בבנייה 2026</div>
    <h1>בדקו עד כמה אתם באמת מוכנים<br>לתקנות הבטיחות החדשות</h1>
    <p class="lead">בדיקה קצרה שתמפה את רמת המוכנות שלכם, תזהה פערים ותסמן את הנושאים שכדאי להסדיר כבר עכשיו.</p>
    <div class="date-box">
      <div class="num">16.10</div>
      <div class="label">מועד כניסת התקנות<br>לתוקף בשנת 2026</div>
    </div>
    <div class="features">
      <span>10 שאלות ממוקדות</span>
      <span>תוצאה מיידית</span>
      <span>ללא עלות</span>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG ===================== */
// הדביקו כאן את כתובת ה-Web App של Google Apps Script (שלב 4 במדריך)
const GAS_URL = "https://script.google.com/macros/s/AKfycbwqeDHEiMEToR3gwaoxndjThJ5FQM2ULW7EVVZrkNNvOG9wY1ZBjnLqhQJUBflNJTrh/exec";
/* ==================================================== */

const TRACKS = {
  owners: {
    name: "יזמים ומזמיני עבודה",
    icon: "◆",
    desc: "בדיקת אחריות, מינויים, בקרה ותיעוד ברמת הפרויקט והחברה",
    questions: [
      "האם תוכנית הבטיחות באתר נבדקה ואושרה על ידכם?",
      "האם וידאתם שהוגדרו המשאבים הנדרשים ליישום התוכנית?",
      "האם נערכתם למינוי בקר בטיחות במועד שבו תחול החובה?",
      "האם הוגדר תהליך להעברת פרטי בקר הבטיחות למבצע הבנייה?",
      "האם ברור לכם מהו סיכון שאינו קביל?",
      "האם קיים נוהל לטיפול בסיכון שאינו קביל בתוך פרק הזמן הנדרש?",
      "האם ברורה לכם האחריות החדשה של מזמין העבודה לבטיחות באתר?",
      "האם הוגדר כיצד תמומש האחריות הזו בפועל?",
      "האם הוגדר תהליך לקבלת דוחות בקר הבטיחות, בחינתם ומתן מענה?",
      "האם הוגדר תהליך לבדיקה ולאישור המינויים של בעלי התפקידים באתר?"
    ]
  },
  contractors: {
    name: "קבלנים ומבצעי בנייה",
    icon: "▦",
    desc: "בדיקת ניהול האתר, תוכנית הבטיחות, כשירות ומעקב אחר ליקויים",
    questions: [
      "האם נערכתם להצבת שלט אתר הכולל את בעלי התפקידים ומהות העבודה?",
      "האם תוכנית הבטיחות נבדקה ואושרה על ידי מזמין העבודה?",
      "האם פורטו המשאבים הנדרשים ליישום תוכנית הבטיחות?",
      "האם הוגדר תהליך לקבלת פרטי בקר הבטיחות מהמזמין?",
      "האם כל טפסי המינוי של בעלי התפקידים מעודכנים וזמינים באתר?",
      "האם תוכנית הבטיחות אושרה בחתימת מבצע הבנייה?",
      "האם הוגדר תהליך למסירת תוכנית הבטיחות לבקר הבטיחות?",
      "האם הוגדר כיצד מנהל האתר יאשר את הטיפול בסיכונים?",
      "האם הוגדר כיצד מנהל האתר יוודא שקיימות התוכניות ההנדסיות הנדרשות?",
      "האם מנהל העבודה ערוך לביצוע סיור יומי, בדיקת מיגון המכונות ועדכון הפנקס הכללי?"
    ]
  }
};
const OPTIONS = [
  { label: "כן, באופן מלא ומתועד", score: 2 },
  { label: "באופן חלקי / לא עקבי", score: 1 },
  { label: "לא / לא ידוע", score: 0 }
];

let state = { screen: "intro", trackKey: null, qIndex: 0, answers: [] };

function render(){
  const c = document.getElementById("card");
  if(state.screen === "intro") c.innerHTML = introHTML();
  else if(state.screen === "question") c.innerHTML = questionHTML();
  else if(state.screen === "result") c.innerHTML = resultHTML();
  else if(state.screen === "success") c.innerHTML = successHTML();
}

function introHTML(){
  return `
    <h2>בחרו את מסלול הבדיקה</h2>
    <p class="sub">שאלון מקצועי המבוסס על דרישות תקנות הבטיחות החדשות ועל בחינת האחריות של מזמין העבודה ומבצע הבנייה. התוכן מותאם לאחריות ולתהליכים הנדרשים בכל צד של הפרויקט.</p>
    ${Object.keys(TRACKS).map(key => `
      <div class="track-card" onclick="startTrack('${key}')">
        <div class="track-icon">${TRACKS[key].icon}</div>
        <div>
          <h3>${TRACKS[key].name}</h3>
          <p>${TRACKS[key].desc}</p>
        </div>
      </div>
    `).join("")}
  `;
}

function startTrack(key){
  state = { screen:"question", trackKey:key, qIndex:0, answers:[] };
  render();
}

function questionHTML(){
  const track = TRACKS[state.trackKey];
  const q = track.questions[state.qIndex];
  return `
    <div class="progress-row">
      <span>שאלה ${state.qIndex+1} מתוך ${track.questions.length}</span>
      <span>${track.name}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${((state.qIndex+1)/track.questions.length)*100}%"></div></div>
    <div class="q-title">${q}</div>
    ${OPTIONS.map((opt,i) => `<div class="option" onclick="answer(${i})">${opt.label}</div>`).join("")}
    ${state.qIndex>0 ? `<button class="back-link" onclick="back()">→ חזרה</button>` : ""}
  `;
}

function answer(i){
  state.answers.push(OPTIONS[i]);
  const track = TRACKS[state.trackKey];
  if(state.qIndex < track.questions.length-1){
    state.qIndex++;
  } else {
    state.screen = "result";
  }
  render();
}

function back(){
  state.qIndex--;
  state.answers.pop();
  render();
}

function computeScore(){
  const total = state.answers.reduce((s,a)=>s+a.score,0);
  const max = state.answers.length*2;
  return Math.round((total/max)*100);
}

function getGaps(){
  const track = TRACKS[state.trackKey];
  const items = state.answers.map((a,i)=>({q:track.questions[i], score:a.score}))
    .filter(x=>x.score<2)
    .sort((a,b)=>a.score-b.score);
  return items.slice(0,2);
}

function resultHTML(){
  const track = TRACKS[state.trackKey];
  const score = computeScore();
  const gaps = getGaps();
  let level, msg, color;
  if(score>=80){ level="מוכנות גבוהה"; color="var(--green)"; msg="קיימת אצלכם תשתית טובה. מומלץ להשלים אימות פרטני ולוודא שהיישום עקבי בכל הפרויקטים."; }
  else if(score>=50){ level="מוכנות חלקית"; color="var(--amber)"; msg="קיימת אצלכם התחלה סבירה, אך נדרשת השלמה של מספר נושאים מרכזיים כדי לעמוד בדרישות התקנות החדשות."; }
  else { level="חשיפה משמעותית"; color="var(--red)"; msg="זוהו פערים משמעותיים מול דרישות התקנות החדשות. מומלץ לפעול בהקדם לסגירת הפערים ולהיערכות מסודרת."; }

  const circumference = 2*Math.PI*48;
  const offset = circumference - (score/100)*circumference;

  return `
    <div class="result-top">
      <span class="pill">דוח מוכנות ראשוני</span>
    </div>
    <div class="track-name">${track.name}</div>
    <div class="score-wrap">
      <div class="ring">
        <svg width="110" height="110">
          <circle cx="55" cy="55" r="48" stroke="#eef1f5" stroke-width="10" fill="none"/>
          <circle cx="55" cy="55" r="48" stroke="${color}" stroke-width="10" fill="none"
            stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="center"><b>${score}</b><span>ציון מוכנות</span></div>
      </div>
      <div class="score-text">
        <h3 style="color:${color}">${level}</h3>
        <p>${msg}</p>
      </div>
    </div>
    <div class="legend">
      <span><i class="g"></i>מוכנות גבוהה</span>
      <span><i class="a"></i>מוכנות חלקית</span>
      <span><i class="r"></i>חשיפה משמעותית</span>
    </div>
    ${gaps.length ? `
      <div class="gaps-title"><span class="bar"></span>${gaps.length>1?"שני הפערים המרכזיים":"הפער המרכזי"}</div>
      ${gaps.map((g,i)=>`
        <div class="gap-item">
          <div class="num">${i+1}</div>
          <p>${g.q}</p>
          <span class="tag-fix">לטיפול</span>
        </div>
      `).join("")}
    ` : ""}
    <div class="lead-box">
      <h4>לקבלת הפירוט המלא של הממצאים לפי נושאים</h4>
      <p class="hint">מלאו את הפרטים והדוח המלא יוצג מיד.</p>
      <form id="leadForm" onsubmit="submitLead(event)">
        <div class="field-row">
          <div class="field"><label>שם</label><input required id="f_first" /></div>
          <div class="field"><label>שם משפחה</label><input required id="f_last" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>תפקיד</label><input required id="f_role" /></div>
          <div class="field"><label>חברה</label><input required id="f_company" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>מספר נייד</label><input required id="f_phone" type="tel" /></div>
        </div>
        <button class="submit-btn" id="submitBtn" type="submit">הצגת הדוח המלא</button>
        <div id="errMsg"></div>
      </form>
    </div>
    <p class="disclaimer">השאלון מעניק אינדיקציה ראשונית בלבד ואינו מהווה ייעוץ משפטי, הנדסי או בטיחותי.</p>
    <button class="restart" onclick="restart()">התחלת בדיקה חדשה</button>
  `;
}

function submitLead(e){
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const err = document.getElementById("errMsg");
  err.innerHTML = "";
  const payload = {
    timestamp: new Date().toLocaleString("he-IL"),
    track: TRACKS[state.trackKey].name,
    score: computeScore(),
    firstName: document.getElementById("f_first").value,
    lastName: document.getElementById("f_last").value,
    role: document.getElementById("f_role").value,
    company: document.getElementById("f_company").value,
    phone: document.getElementById("f_phone").value,
    gaps: getGaps().map(g=>g.q).join(" | "),
    answers: state.answers.map((a,i)=>`${TRACKS[state.trackKey].questions[i]} => ${a.label}`).join(" || ")
  };

  if(GAS_URL.indexOf("PASTE_YOUR") === 0){
    err.innerHTML = '<div class="error-msg">טרם הוגדר חיבור ל-Google Sheets. ראו קובץ ההוראות המצורף.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = "שולח...";

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(()=>{
    state.lead = payload;
    state.screen = "success";
    render();
  }).catch(()=>{
    btn.disabled = false;
    btn.textContent = "הצגת הדוח המלא";
    err.innerHTML = '<div class="error-msg">שגיאה בשליחה. נסו שוב.</div>';
  });
}

function successHTML(){
  return `
    <div class="success-box">
      <div class="ok">✓</div>
      <h3>הפרטים נשלחו בהצלחה</h3>
      <p>תודה, ${state.lead.firstName}! הדוח המלא יישלח אליכם בהקדם, והפרטים נקלטו במערכת שלנו.</p>
      <button class="restart" onclick="restart()" style="margin-top:20px;">התחלת בדיקה חדשה</button>
    </div>
  `;
}

function restart(){
  state = { screen:"intro", trackKey:null, qIndex:0, answers:[] };
  render();
}

render();
</script>
</body>
</html>
